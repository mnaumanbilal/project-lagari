        productViewSessions:
          type: integer
        addToCartSessions:
          type: integer
        viewThenCartSessions:
          type: integer
        checkoutStarts:
          type: integer
        cartThenCheckoutSessions:
          type: integer
        checkoutConversions:
          type: integer
        orderPlacedSessions:
          type: integer
